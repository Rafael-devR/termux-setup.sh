# Ferramenta do termux-setup. Formato: docs/MODULOS.md

id = "codex"
name = "Codex CLI (OpenAI)"
description = "CLI da OpenAI via npm, dentro do Ubuntu."
group = "ia"
order = 310
target = "none"
requires = ["ubuntu", "ubnode"]
arch = ["aarch64", "x86_64"]  # 64 bits
presets = ["ia", "tudo"]
verify = ["codex --version"]
verify_in = "ubuntu"

[estimate]  # aproximado, base arm64
seconds = 30
download_mb = 40
disk_mb = 120

[[steps]]
label = "Codex CLI (OpenAI)"
action = "ub-npm"
args = ["@openai/codex"]
seconds = 30

[[finalize]]
label = "Criar comandos ubuntu / ia-run"
action = "ub-commands"
seconds = 1
