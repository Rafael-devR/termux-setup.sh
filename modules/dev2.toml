# Ferramenta do termux-setup. Formato: docs/MODULOS.md

id = "dev2"
name = "Dev+: gh lazygit neovim"
description = "GitHub CLI, git visual e Neovim."
group = "termux"
order = 110
packages = ["gh", "lazygit", "neovim"]
