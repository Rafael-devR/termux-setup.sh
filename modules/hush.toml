# Ferramenta do termux-setup. Formato: docs/MODULOS.md

id = "hush"
name = "Silenciar boas-vindas"
description = "Cria ~/.hushlogin (sem o texto grande ao abrir)."
group = "aparencia"
order = 400
target = "none"
presets = ["dev", "tudo"]

[estimate]  # aproximado, base arm64
seconds = 1
download_mb = 0
disk_mb = 0

[[steps]]
label = "Silenciar boas-vindas"
action = "hush"
seconds = 1

[[finalize]]
label = "Aplicar aparência"
action = "reload-settings"
seconds = 1
